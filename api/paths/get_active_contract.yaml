get:
  operationId: get_active_contract
  summary: Get the company's contract with active status
  parameters:
    - name: client_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
  responses:
    '200':
      $ref: '../contract.yaml#/components/responses/ContractFound'
    '400':
      $ref: '../contract.yaml#/components/responses/BadRequest'
    '404':
      $ref: '../contract.yaml#/components/responses/NotFound'
    '500':
      $ref: '../contract.yaml#/components/responses/InternalServerError'
