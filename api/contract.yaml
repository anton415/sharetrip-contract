openapi: 3.0.3
info:
  title: ShareTrip Contract Service API
  version: 0.1.0
paths:
  /create_contract:
    post:
      operationId: create_contract
      summary: Create a draft contract
      description: Transport stub. Returns a contract without saving it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Draft contract created in memory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateContractResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /sign_contract:
    post:
      operationId: sign_contract
      summary: Return an active contract stub
      description: Transport stub. Does not look up or update an existing contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignContractRequest'
      responses:
        '200':
          description: Requested identifier and active status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignContractResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateContractRequest:
      type: object
      required: [client_id]
      properties:
        client_id:
          type: string
          format: uuid
        expired_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    CreateContractResponse:
      type: object
      required: [contract]
      properties:
        contract:
          $ref: '#/components/schemas/Contract'
      additionalProperties: false
    SignContractRequest:
      type: object
      required: [contract_id]
      properties:
        contract_id:
          type: string
          format: uuid
      additionalProperties: false
    SignContractResponse:
      type: object
      required: [contract]
      properties:
        contract:
          $ref: '#/components/schemas/SignedContract'
      additionalProperties: false
    ContractStatus:
      type: string
      enum: [draft, active]
    Contract:
      type: object
      required: [id, client_id, status, created_at, updated_at, expired_at]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContractStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expired_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    SignedContract:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContractStatus'
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false
