openapi: 3.0.3
info:
  title: ShareTrip Contract Service API
  version: 0.1.0
paths:
  /health:
    $ref: './paths/health.yaml'
  /contracts/check-service:
    $ref: './paths/check_service.yaml'
  /contracts/{contract_id}/configure-services:
    $ref: './paths/configure_contract_services.yaml'
  /contracts/{contract_id}:
    $ref: './paths/get_contract.yaml'
  /clients/{client_id}/contracts/active:
    $ref: './paths/get_active_contract.yaml'
  /create_contract:
    $ref: './paths/create_contract.yaml'
  /sign_contract:
    $ref: './paths/sign_contract.yaml'
components:
  responses:
    ContractFound:
      description: Contract found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetContractResponse'
    NotFound:
      description: Contract not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Contract cannot be signed in its current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ContractNotDraft:
      description: Contract services can be configured only for a draft contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request body or identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CheckServiceRequest:
      type: object
      required: [client_id, service_code]
      properties:
        client_id:
          type: string
          format: uuid
        service_code:
          type: string
          minLength: 1
      additionalProperties: false
    CheckServiceResponse:
      type: object
      required: [allowed, reason]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          enum: [service_allowed, contract_not_found, contract_not_active, contract_expired, service_not_allowed]
      additionalProperties: false
    ConfigureContractServicesRequest:
      type: object
      required: [services]
      properties:
        services:
          type: array
          minItems: 1
          description: Each service_code must be unique within the request.
          items:
            $ref: '#/components/schemas/ContractServiceInput'
      additionalProperties: false
    ContractServiceInput:
      type: object
      required: [service_code, enabled]
      properties:
        service_code:
          type: string
          enum: [trip_creation, trip_participants, notifications, trip_start]
        enabled:
          type: boolean
          x-go-type: '*bool'
      additionalProperties: false
    GetContractResponse:
      type: object
      required: [contract]
      properties:
        contract:
          $ref: '#/components/schemas/Contract'
      additionalProperties: false
    CreateContractRequest:
      type: object
      required: [client_id]
      properties:
        client_id:
          type: string
          format: uuid
        expired_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    CreateContractResponse:
      type: object
      required: [contract]
      properties:
        contract:
          $ref: '#/components/schemas/Contract'
      additionalProperties: false
    SignContractRequest:
      type: object
      required: [contract_id]
      properties:
        contract_id:
          type: string
          format: uuid
      additionalProperties: false
    SignContractResponse:
      type: object
      required: [contract]
      properties:
        contract:
          $ref: '#/components/schemas/SignedContract'
      additionalProperties: false
    ContractStatus:
      type: string
      enum: [draft, active, suspended, terminated]
    Contract:
      type: object
      required: [id, client_id, status, created_at, updated_at, expired_at]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContractStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expired_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    SignedContract:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContractStatus'
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false
