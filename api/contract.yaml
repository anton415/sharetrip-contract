openapi: 3.0.3
info:
  title: ShareTrip Contract Service API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: health
      summary: Check HTTP server availability
      responses:
        '200':
          description: HTTP server is running
          content:
            text/plain:
              schema:
                type: string
              example: OK
  /contracts/check-service:
    post:
      operationId: check_service
      summary: Check whether a company can use a service
      description: Requires an active, unexpired contract with the requested service enabled. Business denials return HTTP 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckServiceRequest'
      responses:
        '200':
          description: Service availability decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckServiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /contracts/{contract_id}/services:
    patch:
      operationId: upsert_contract_services
      summary: Add or update contract services
      description: Adds or updates the supplied services atomically. Omitted services are preserved.
      parameters:
        - name: contract_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertContractServicesRequest'
      responses:
        '204':
          description: Services saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /contracts/{contract_id}:
    get:
      operationId: get_contract
      summary: Get a contract by ID
      parameters:
        - name: contract_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: string
      responses:
        '200':
          $ref: '#/components/responses/ContractFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /clients/{client_id}/contracts/active:
    get:
      operationId: get_active_contract
      summary: Get the company's contract with active status
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-go-type: string
      responses:
        '200':
          $ref: '#/components/responses/ContractFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /create_contract:
    post:
      operationId: create_contract
      summary: Create a draft contract
      description: Creates a draft contract and saves it in PostgreSQL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Draft contract created and saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateContractResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sign_contract:
    post:
      operationId: sign_contract
      summary: Sign an existing draft contract
      description: Loads an existing contract and changes its state from draft to active in a transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignContractRequest'
      responses:
        '200':
          description: Contract signed and saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignContractResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    ContractFound:
      description: Contract found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetContractResponse'
    NotFound:
      description: Contract not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Contract cannot be signed in its current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request body or identifier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CheckServiceRequest:
      type: object
      required: [client_id, service_code]
      properties:
        client_id:
          type: string
          format: uuid
        service_code:
          type: string
          minLength: 1
      additionalProperties: false
    CheckServiceResponse:
      type: object
      required: [allowed, reason]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          enum: [service_allowed, contract_not_found, contract_not_active, contract_expired, service_not_allowed]
      additionalProperties: false
    UpsertContractServicesRequest:
      type: object
      required: [services]
      properties:
        services:
          type: array
          minItems: 1
          description: Each service_code must be unique within the request.
          items:
            $ref: '#/components/schemas/ContractServiceInput'
      additionalProperties: false
    ContractServiceInput:
      type: object
      required: [service_code, enabled]
      properties:
        service_code:
          type: string
          enum: [trip_creation, trip_participants, notifications]
        enabled:
          type: boolean
          x-go-type: '*bool'
      additionalProperties: false
    GetContractResponse:
      type: object
      required: [contract]
      properties:
        contract:
          $ref: '#/components/schemas/Contract'
      additionalProperties: false
    CreateContractRequest:
      type: object
      required: [client_id]
      properties:
        client_id:
          type: string
          format: uuid
        expired_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    CreateContractResponse:
      type: object
      required: [contract]
      properties:
        contract:
          $ref: '#/components/schemas/Contract'
      additionalProperties: false
    SignContractRequest:
      type: object
      required: [contract_id]
      properties:
        contract_id:
          type: string
          format: uuid
      additionalProperties: false
    SignContractResponse:
      type: object
      required: [contract]
      properties:
        contract:
          $ref: '#/components/schemas/SignedContract'
      additionalProperties: false
    ContractStatus:
      type: string
      enum: [draft, active, suspended, terminated]
    Contract:
      type: object
      required: [id, client_id, status, created_at, updated_at, expired_at]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContractStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expired_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    SignedContract:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContractStatus'
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false
