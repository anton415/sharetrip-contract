openapi: 3.0.3
info:
  title: ShareTrip Contract Service API
  version: 0.1.0
paths:
  /create_contract:
    post:
      operationId: create_contract
      summary: Create a draft contract
      description: Creates a draft contract and saves it in PostgreSQL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Draft contract created and saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateContractResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sign_contract:
    post:
      operationId: sign_contract
      summary: Sign an existing draft contract
      description: Loads an existing contract and changes its state from draft to active in a transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignContractRequest'
      responses:
        '200':
          description: Contract signed and saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignContractResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    NotFound:
      description: Contract not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Contract cannot be signed in its current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateContractRequest:
      type: object
      required: [client_id]
      properties:
        client_id:
          type: string
          format: uuid
        expired_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    CreateContractResponse:
      type: object
      required: [contract]
      properties:
        contract:
          $ref: '#/components/schemas/Contract'
      additionalProperties: false
    SignContractRequest:
      type: object
      required: [contract_id]
      properties:
        contract_id:
          type: string
          format: uuid
      additionalProperties: false
    SignContractResponse:
      type: object
      required: [contract]
      properties:
        contract:
          $ref: '#/components/schemas/SignedContract'
      additionalProperties: false
    ContractStatus:
      type: string
      enum: [draft, active]
    Contract:
      type: object
      required: [id, client_id, status, created_at, updated_at, expired_at]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContractStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expired_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    SignedContract:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContractStatus'
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false
